# Gate policy for the Python family, not a vulnerability analysis. The analysis lives in
# vex/python.openvex.json, is published alongside the images, and any consumer scanning with --vex gets
# it. This file is read only by the Python scans, through --ignorefile, so nothing here reaches another
# family. The Makefile withholds it from the runtime target, which it scans bare with neither this file
# nor the VEX, so restoring pip in production fails that scan instead of inheriting this entry. The
# monthly rebuild passes it to every target, because there it answers a different question: whether a
# finding is worth opening an issue about, not whether the gate blocks on it.
#
# The entry is a package pip declares inside its own wheel, listed in pip/_vendor/bom.cdx.json, which
# Trivy reads as a separate component named "Python". It is not a package the image installs:
# setuptools is installed nowhere. pip 26.3, the newest release, still declares setuptools 70.3.0, so
# there is no pip to move to.
#
# The VEX already states it as not_affected, with reasoning verified inside the image: `import
# setuptools` raises ModuleNotFoundError on all four targets. The entry exists because that suppression
# proved environment dependent: the same image, scanner and document suppressed it on this machine and
# did not on the CI runner, and a gate that passes or fails by environment is not a gate. It makes the
# decision explicit instead of inherited.
#
# The entry carries no `paths` restriction, which a policy for a vendored binary would. Trivy names
# this component "Python" rather than a file path, so a path restriction matches nothing and the entry
# silently fails to apply, which was measured before writing it this way. The cost is real: the
# identifier is now accepted anywhere in the family, including in site-packages if it ever reappeared
# there. That is why it is named individually and no wildcard is used.
#
# Accepted 2026-08-17, re-verified 2026-11-14 against pip 26.3, which is the newest release: it
# declares setuptools 70.3.0, and `import setuptools` still raises ModuleNotFoundError inside the
# image. CVE-2025-47273 retires when a pip release declares setuptools 78.1.1 or later or stops
# declaring it. At that point the finding disappears rather than being accepted. `expired_at` forces
# the question either way.
#
# The window is a quarter rather than a month. The first one was a month, so it lapsed on 2026-09-17
# with the finding unchanged, which turns the gate red on a decision nobody revisited rather than on a
# finding that moved. The rebuild is monthly now, and an expiry set to that same period would do this
# every cycle. Three cycles is long enough to be a real prompt and short enough to still be one.
#
# Three entries left this file with pip 26.3, each by the condition written beside it when it was
# accepted. GHSA-6v7p-g79w-8964 was the msgpack 1.1.2 that pip vendored, and CVE-2026-97687 and
# CVE-2026-97689 were the urllib3 2.7.0 it vendored. pip 26.3 vendors msgpack 1.2.4 and urllib3 2.8.0,
# and a bare scan of the three targets that ship pip no longer reports any of them, so they retired
# rather than being carried forward.
vulnerabilities:
    - id: CVE-2025-47273
      statement: "setuptools declared in pip's vendor manifest but not importable in any target."
      expired_at: 2026-12-19
