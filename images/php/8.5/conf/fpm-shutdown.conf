; PHP-FPM graceful shutdown drain window. process_control_timeout is a [global] directive, and the
; alphabetical php-fpm.d include order reaches this file with the [www] pool of zz-docker.conf still
; open, so both sections are switched explicitly.

[global]

; On SIGQUIT the master waits this long for workers to finish their in-flight request before
; escalating. Sized to fit inside the 10s default stop timeout of `docker stop` and Compose. An
; orchestrator with a longer grace period raises it from its own drop-in.
process_control_timeout = 10s

; Reopened so any include sorted after this file keeps extending [www] with bare directives.
[www]
