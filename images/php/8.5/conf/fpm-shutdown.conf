; PHP-FPM graceful shutdown drain window.
;
; Copied into the runtime target as zz-gustavofreze-shutdown.conf, so the development target
; inherits it. process_control_timeout is a [global] directive, and the alphabetical php-fpm.d
; include order reaches this file with the [www] pool of zz-docker.conf still open, so the section
; is switched explicitly.

[global]

; On SIGQUIT (the STOPSIGNAL the upstream FPM image sets) the master waits up to 10s for workers to
; finish their in-flight request before escalating to SIGTERM. Sized to fit inside the 10s default
; stop timeout of `docker stop` and Compose. An orchestrator with a longer grace period (the
; Kubernetes default is 30s) can raise it from its own drop-in loaded after this file.
process_control_timeout = 10s

; Reopen the pool so any include sorted after this file keeps extending [www] with bare directives,
; the pattern the development logging drop-in relies on.
[www]
