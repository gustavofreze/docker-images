; Xdebug defaults for the development and cli targets. The runtime never loads this file and never
; carries the extension.

xdebug.mode = develop,coverage,debug
xdebug.idekey = php.xdebug
xdebug.log_level = 0
xdebug.cli_color = 1
xdebug.client_port = 9003
xdebug.start_with_request = yes
xdebug.discover_client_host = 1
