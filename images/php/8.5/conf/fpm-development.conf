; Development PHP-FPM pool overrides. Loaded after www.conf, zz-docker.conf, and the shutdown
; drop-in in the alphabetical php-fpm.d include order, so these bare directives continue the
; already open [www] pool.
;
; Worker output reaches the container log undecorated, so error_log and var_dump from a request
; show up in `docker logs` while developing.

catch_workers_output = yes
decorate_workers_output = no
