; Production OPcache tuning for the runtime target.

[opcache]
opcache.enable = 1
opcache.enable_cli = 1

opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Code in a production image never changes after the build, so the stat call per include is pure
; overhead. A deployment ships a new image, not a new file in the same one.
opcache.validate_timestamps = 0

opcache.enable_file_override = 1
opcache.save_comments = 1

opcache.jit = tracing
opcache.jit_buffer_size = 128M
