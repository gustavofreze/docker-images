; Development overrides, loaded after the hardening drop-in. This image runs on a developer machine
; and is never deployed.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
zend.assertions = 1
zend.exception_ignore_args = Off

; Composer, and any library that spawns a process, needs the functions the runtime disables.
disable_functions =

memory_limit = 512M
