; Development overrides, loaded after the production hardening drop-in. This image runs on a
; developer machine and is never deployed, so errors surface in the terminal instead of a log file.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
zend.assertions = 1
zend.exception_ignore_args = Off

; Composer, and any library that spawns a process, needs the functions the production runtime
; disables. Clearing the list here keeps the restriction on the runtime target alone.
disable_functions =

memory_limit = 512M
