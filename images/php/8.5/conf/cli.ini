; Tooling defaults for the cli image.

memory_limit = 512M

; Diagnostics on stderr, never stdout. A `phpcs --report=json` run is piped, and a deprecation
; notice from a third-party phar landing on stdout would corrupt it.
display_errors = stderr
display_startup_errors = stderr
error_reporting = E_ALL

zend.assertions = 1
date.timezone = America/Sao_Paulo
