; Tooling defaults for the cli image. Static analysis, CodeSniffer, and Composer need more headroom
; than the 128M engine default, and a tooling run reports its errors to the terminal.

memory_limit = 512M

; Diagnostics go to stderr, never stdout. A tooling image is piped: `phpcs --report=json` and
; `phpmd ... json` are parsed by the caller, and a deprecation notice from a third-party phar landing
; on stdout would corrupt that output. On is the CLI default and writes to stdout, stderr is what
; keeps the two streams separable.
display_errors = stderr
display_startup_errors = stderr
error_reporting = E_ALL

zend.assertions = 1
date.timezone = America/Sao_Paulo
