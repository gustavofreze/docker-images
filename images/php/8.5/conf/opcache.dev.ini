; Development OPcache tuning. Written to the same drop-in file name as the production tuning, so
; this replaces it in the development target. Timestamps are validated on every request and the JIT
; is off, so an edit on a bind-mounted source tree takes effect immediately and stack traces stay
; readable.

[opcache]
opcache.enable = 1
opcache.enable_cli = 1

opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000

opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

opcache.save_comments = 1

opcache.jit = disable
opcache.jit_buffer_size = 0
