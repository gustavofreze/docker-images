; Production hardening baked into the PHP runtime image, loaded first among the drop-ins.
; These are explicit overrides on top of php.ini-production, so the values survive an accidental
; php.ini swap inside a consuming image. The development target overrides what it needs in
; zz-gustavofreze-90-development.ini, which loads after this file.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Process and shell escapes an FPM worker has no legitimate need for. An application that does
; shell out re-enables the functions it needs in its own drop-in, loaded after this one.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

; Remote code inclusion is never a legitimate application need.
allow_url_include = Off

; Stack traces never carry argument values into a log line.
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; Session cookies are transport locked, script unreadable, and not sent cross-site.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict

memory_limit = 256M
date.timezone = America/Sao_Paulo

; Path resolution cache sized for a deep vendor tree.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
