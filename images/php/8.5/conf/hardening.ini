; Production hardening, loaded first among the drop-ins. Explicit overrides on top of
; php.ini-production, so the values survive an accidental php.ini swap in a consuming image.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; An application that legitimately shells out re-enables what it needs in its own drop-in.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

allow_url_include = Off

zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict

memory_limit = 256M
date.timezone = America/Sao_Paulo

realpath_cache_size = 4096K
realpath_cache_ttl = 600
