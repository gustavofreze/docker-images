# Gate policy for the Python family, not a vulnerability analysis. The analysis lives in
# vex/python.openvex.json, is published alongside the images, and any consumer scanning with --vex gets
# it. This file is read only by the Python scans, through GRYPE_CONFIG, so nothing here reaches another
# family.
#
# The entry is `affected` in the VEX, which is the truthful status: the image is built on CPython
# 3.14.9 and carries it. Grype cross-references the upstream advisory, which names a fixed release,
# so --only-fixed keeps reporting it, correctly. This file is the separate, explicit decision that
# the gate does not stop on it. Nothing that is genuinely not affected belongs here: that is
# expressed in the VEX and suppressed by the scanners on their own.
#
# No fix exists on the CPython 3.14 line. CVE-2025-15367 is fixed only in 3.15.0a6, and 3.15 has no
# stable release, so taking it would mean shipping a base image built on a pre-release.
# CVE-2026-15308 left this file with 3.14.8: a bare scan of python:3.14.8-alpine3.24 no longer reports
# it, so it retired rather than being carried forward.
#
# Grype has no expiry field, unlike the Trivy policy beside it, so this block will not lapse on its
# own. Accepted 2026-08-12, re-verified 2026-10-26 against 3.14.9, the newest release on the 3.14 line,
# which still carries it. Delete it when 3.15.0 ships stable or a backport lands on 3.14.x.
ignore:
    - vulnerability: CVE-2025-15367
      package:
          name: python
