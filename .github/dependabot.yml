version: 2

# Every ecosystem runs monthly. An update here is never merged on its own: it changes a build unit, so
# it bumps that unit's VERSION and republishes immutable tags, and each republication costs a full
# multi-architecture build, scan, audit and smoke run. Monthly is the cadence that rate is worth.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/images/php/8.5"
      - "/images/python/3.14"
      - "/images/rust/1.100"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "php"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "python"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "rust"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
      - dependency-name: "alpine"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    groups:
      docker:
        patterns:
          - "*"

  # Reaches the Python tooling that no other ecosystem sees. The docker ecosystem above reads the FROM
  # pins and nothing else, so before this the pip, Poetry and debugpy versions and the resolved tree
  # behind them aged with no updater watching any of them.
  - package-ecosystem: "pip"
    directories:
      - "/images/python/3.14"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "python"
    # constraints.txt is a resolved tree, not a manifest, but the pip ecosystem reads it as one and
    # floats every line in it to the newest release. Only the tools the requirements files name are
    # updated here. The tree moves when one of them does, and the header of constraints.txt says how
    # to regenerate it.
    allow:
      - dependency-name: "pip"
      - dependency-name: "poetry"
      - dependency-name: "debugpy"
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
    groups:
      validators:
        patterns:
          - "*"
