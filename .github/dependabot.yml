version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Mirrors the repository dependency policy: never adopt a release published less than 7 days ago.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/images/php/8.5"
      - "/images/python/3.14"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns:
          - "*"

  # Reaches the Python tooling that no other ecosystem sees. The docker ecosystem above reads the FROM
  # pins and nothing else, so before this the pip, Poetry and debugpy versions and the resolved tree
  # behind them aged with no updater watching any of them.
  - package-ecosystem: "pip"
    directories:
      - "/images/python/3.14"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "python"
    # constraints.txt is a resolved tree, not a manifest, but the pip ecosystem reads it as one and
    # floats every line in it to the newest release. poetry pins poetry-core exactly (poetry 2.4.1
    # requires poetry-core==2.4.0), so a floated line there opens a pull request that can never
    # build. That line moves when a pin in requirements.txt moves, and the header of constraints.txt
    # says how to regenerate the tree around it.
    ignore:
      - dependency-name: "poetry-core"
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
    groups:
      validators:
        patterns:
          - "*"
