name: CI

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1

jobs:
  version-guard:
    name: Version guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert every touched build unit bumped its VERSION
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mapfile -t units < <(./scripts/changed-build-units.sh "${BASE_SHA}" "${HEAD_SHA}")

          failed=0
          for unit in "${units[@]:-}"; do
            [[ -n "${unit}" ]] || continue

            if [[ -z "$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- "${unit}/VERSION")" ]]; then
              echo "::error file=${unit}/VERSION::${unit} changed but ${unit}/VERSION was not bumped. Version tags are immutable."
              failed=1
              continue
            fi

            echo "ok: ${unit} bumped to $(cat "${unit}/VERSION")"
          done

          exit "${failed}"

  discover:
    name: Discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      families: ${{ steps.set-matrix.outputs.families }}
    steps:
      - uses: actions/checkout@v7

      - id: set-matrix
        run: echo "families=$(./scripts/discover-images.sh --format=families)" >> "$GITHUB_OUTPUT"

  review:
    name: "Review ${{ matrix.family }} on ${{ matrix.runner }}"
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJson(needs.discover.outputs.families) }}
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
    steps:
      - uses: actions/checkout@v7

      - name: Run the full gate
        run: make review-${{ matrix.family }}
