name: CD

on:
  push:
    branches: [ main ]
    paths:
      - 'images/**'
      - 'scripts/**'
      - 'Makefile'
      - '.dive-ci'
      - '.hadolint.yaml'
      - '.github/workflows/cd.yml'

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      families: ${{ steps.set-matrix.outputs.families }}
    steps:
      - uses: actions/checkout@v7

      - id: set-matrix
        run: |
          echo "matrix=$(./scripts/discover-images.sh --format=json)" >> "$GITHUB_OUTPUT"
          echo "families=$(./scripts/discover-images.sh --format=families)" >> "$GITHUB_OUTPUT"

  review:
    name: "Review ${{ matrix.family }}"
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        family: ${{ fromJson(needs.discover.outputs.families) }}
    steps:
      - uses: actions/checkout@v7

      - name: Run the full gate
        run: make review-${{ matrix.family }}

  publish:
    name: "Publish ${{ matrix.family }}:${{ matrix.tag }}"
    needs: [ discover, review ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GitHub container registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The versioned tag never changes meaning once published. The alias is a pointer the weekly
      # security rebuild repoints.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.family }}:${{ matrix.tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.family }}:${{ matrix.alias }}
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ matrix.family }}:${{ matrix.tag }}
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ matrix.family }}:${{ matrix.alias }}
          cache-from: type=gha,scope=${{ matrix.family }}
          cache-to: type=gha,mode=max,scope=${{ matrix.family }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  scan:
    name: "Scan ${{ matrix.family }}:${{ matrix.tag }}"
    needs: [ discover, publish ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          image-ref: "${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ matrix.family }}:${{ matrix.tag }}"
          limit-severities-for-sarif: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: "trivy-${{ matrix.family }}-${{ matrix.target }}"

  cleanup:
    name: Cleanup
    needs: [ discover, publish, scan ]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: ${{ fromJson(needs.discover.outputs.families) }}
    steps:
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
