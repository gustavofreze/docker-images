<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image family targets</title>
  <!-- Drawn with the diagram-design skill, Skedli palette (white canvas variant). Export the README SVG from
       skedli-context with python3 helpers/diagram_export.py <this file>, which runs the skill's export_svg.py
       and outlines every text as a path, so the image depends on no font. -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-ink: #011f51; --color-muted: #3f4a66;
      --font-sans: 'Nunito', 'Nunito Variable', system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { font-family: var(--font-sans); background: #ffffff; color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: 0.8rem; font-weight: 600; color: var(--color-muted); margin-bottom: 0.25rem; }
    h1 { font-size: 1.6rem; font-weight: 700; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1104px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">docker-images · targets</p>
    <h1>Image family targets</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1104 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="docker-images-targets-title docker-images-targets-desc">
        <title id="docker-images-targets-title">Image family targets</title>
        <desc id="docker-images-targets-desc">The four targets every image family ships from one Dockerfile and what consumes each one: the builder and the runtime make the production image of a project, the development target is the base of its local environment, and the cli target runs its Makefile commands.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#2e58d6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
          <marker id="arrow-sync" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#2e58d6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
          <marker id="arrow-async" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#0b5573" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
        </defs>

        <rect width="100%" height="100%" rx="12" fill="#ffffff"/>

        <!-- Captions -->
        <text x="40" y="44" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Built from</text>
        <text x="864" y="44" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Consumed by</text>

        <!-- Upstream pin into the family -->
        <line x1="232" y1="104" x2="416" y2="104" stroke="#2e58d6" stroke-width="1.2" marker-end="url(#arrow-sync)"/>

        <!-- Each target to its consumer -->
        <line x1="720" y1="180" x2="864" y2="180" stroke="#2e58d6" stroke-width="1.2" marker-end="url(#arrow-sync)"/>
        <line x1="720" y1="260" x2="864" y2="260" stroke="#2e58d6" stroke-width="1.2" marker-end="url(#arrow-sync)"/>
        <line x1="720" y1="340" x2="864" y2="340" stroke="#2e58d6" stroke-width="1.2" marker-end="url(#arrow-sync)"/>
        <line x1="720" y1="420" x2="864" y2="420" stroke="#2e58d6" stroke-width="1.2" marker-end="url(#arrow-sync)"/>

        <!-- Upstream -->
        <rect x="40" y="64" width="192" height="80" rx="12" fill="#e7ebf3"/>
        <g transform="translate(54 94.0) scale(0.833333)" fill="none" stroke="#3f4a66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" /> <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" /> <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></g>
        <text x="88" y="92.0" fill="#011f51" font-size="13" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Upstream image</text>
        <text x="88" y="110.0" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Exact patch and distro,</text>
        <text x="88" y="125.0" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">never a moving tag</text>

        <!-- Image family (focal, dotted boundary) -->
        <rect x="416" y="64" width="304" height="404" rx="12" fill="#e4ecff" stroke="#2e58d6" stroke-width="1.2" stroke-dasharray="1.5,3.5"/>
        <g transform="translate(440 84) scale(0.916667)" fill="none" stroke="#2e58d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7.7c0-.6-.4-1.2-.8-1.5l-6.3-3.9a1.72 1.72 0 0 0-1.7 0l-10.3 6c-.5.2-.9.8-.9 1.4v6.6c0 .5.4 1.2.8 1.5l6.3 3.9a1.72 1.72 0 0 0 1.7 0l10.3-6c.5-.3.9-1 .9-1.5Z" /> <path d="M10 21.9V14L2.1 9.1" /> <path d="m10 14 11.9-6.9" /> <path d="M14 19.8v-8.1" /> <path d="M18 17.5V9.4" /></g>
        <text x="472" y="101" fill="#011f51" font-size="16" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Image family</text>
        <text x="440" y="124" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">php, python, rust: one Dockerfile each</text>
        <rect x="432" y="148" width="272" height="64" rx="10" fill="#ffffff"/>
        <text x="568.0" y="176.0" fill="#011f51" font-size="12.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700" text-anchor="middle">builder</text>
        <text x="568.0" y="193.0" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" text-anchor="middle">Toolchain for the build stage, non-root</text>
        <rect x="432" y="228" width="272" height="64" rx="10" fill="#ffffff"/>
        <text x="568.0" y="256.0" fill="#011f51" font-size="12.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700" text-anchor="middle">runtime</text>
        <text x="568.0" y="273.0" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" text-anchor="middle">Production base, non-root</text>
        <rect x="432" y="308" width="272" height="64" rx="10" fill="#ffffff"/>
        <text x="568.0" y="336.0" fill="#011f51" font-size="12.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700" text-anchor="middle">development</text>
        <text x="568.0" y="353.0" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" text-anchor="middle">Built FROM runtime, plus local tooling</text>
        <rect x="432" y="388" width="272" height="64" rx="10" fill="#ffffff"/>
        <text x="568.0" y="416.0" fill="#011f51" font-size="12.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700" text-anchor="middle">cli</text>
        <text x="568.0" y="433.0" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" text-anchor="middle">One-shot tooling, runs as root</text>

        <!-- Consumers -->
        <rect x="864" y="148" width="200" height="144" rx="12" fill="#e7ebf3"/>
        <g transform="translate(878 210.0) scale(0.833333)" fill="none" stroke="#3f4a66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2" /> <rect width="20" height="8" x="2" y="14" rx="2" ry="2" /> <line x1="6" x2="6.01" y1="6" y2="6" /> <line x1="6" x2="6.01" y1="18" y2="18" /></g>
        <text x="912" y="208.0" fill="#011f51" font-size="13" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Production image</text>
        <text x="912" y="226.0" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Compiled in the builder,</text>
        <text x="912" y="241.0" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">shipped on the runtime</text>
        <rect x="864" y="308" width="200" height="64" rx="12" fill="#e7ebf3"/>
        <g transform="translate(878 330.0) scale(0.833333)" fill="none" stroke="#3f4a66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v4" /> <path d="m14.305 7.53.923-.382" /> <path d="m15.228 4.852-.923-.383" /> <path d="m16.852 3.228-.383-.924" /> <path d="m16.852 8.772-.383.923" /> <path d="m19.148 3.228.383-.924" /> <path d="m19.53 9.696-.382-.924" /> <path d="m20.772 4.852.924-.383" /> <path d="m20.772 7.148.924.383" /> <path d="M22 13v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7" /> <path d="M8 21h8" /> <circle cx="18" cy="6" r="3" /></g>
        <text x="912" y="337.0" fill="#011f51" font-size="13" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Local environment</text>
        <text x="912" y="354.0" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Compose, mounted code</text>
        <rect x="864" y="388" width="200" height="64" rx="12" fill="#e7ebf3"/>
        <g transform="translate(878 410.0) scale(0.833333)" fill="none" stroke="#3f4a66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8" /> <path d="m4 17 6-6-6-6" /></g>
        <text x="912" y="417.0" fill="#011f51" font-size="13" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="700">Makefile commands</text>
        <text x="912" y="434.0" fill="#3f4a66" font-size="11" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Lint, test, one-shot runs</text>

        <!-- Arrow labels -->
        <rect x="248" y="87" width="66" height="14" rx="3" fill="#ffffff"/>
        <text x="252" y="98" fill="#3f4a66" font-size="10" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">Pinned FROM</text>
        <rect x="736" y="163" width="66" height="14" rx="3" fill="#ffffff"/>
        <text x="740" y="174" fill="#3f4a66" font-size="10" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">COPY --from</text>
        <rect x="736" y="243" width="29" height="14" rx="3" fill="#ffffff"/>
        <text x="740" y="254" fill="#3f4a66" font-size="10" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">FROM</text>
        <rect x="736" y="323" width="29" height="14" rx="3" fill="#ffffff"/>
        <text x="740" y="334" fill="#3f4a66" font-size="10" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">FROM</text>
        <rect x="736" y="403" width="61" height="14" rx="3" fill="#ffffff"/>
        <text x="740" y="414" fill="#3f4a66" font-size="10" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif" font-weight="600">docker run</text>

        <!-- Legend, one row -->
        <line x1="40" y1="512" x2="1064" y2="512" stroke="#dbe0ec" stroke-width="1"/>
        <rect x="40" y="527" width="18" height="12" rx="4" fill="#e4ecff" stroke="#2e58d6" stroke-width="1" stroke-dasharray="1.5,2.5"/>
        <text x="66" y="536" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Image family</text>
        <rect x="158" y="527" width="18" height="12" rx="4" fill="#e7ebf3"/>
        <text x="184" y="536" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Outside this repository</text>
        <line x1="336" y1="533" x2="360" y2="533" stroke="#2e58d6" stroke-width="1.2" marker-end="url(#arrow-sync)"/>
        <text x="368" y="536" fill="#3f4a66" font-size="10.5" font-family="'Nunito', 'Nunito Variable', system-ui, sans-serif">Build or run dependency</text>
      </svg>
    </div>
  </div>
</body>
</html>
